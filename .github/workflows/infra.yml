name: infra

# Pipeline de infraestructura. Es dueno de la existencia y la configuracion
# de la funcion, y no toca la imagen.

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      autorizar_destruccion:
        description: 'Autoriza que el plan destruya o reemplace recursos (Regla 1)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'

jobs:

  # Sintaxis e integridad: formato, inicializacion contra el backend remoto
  # y validacion. Cualquiera que falle detiene el job.
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.10'
          terraform_wrapper: false

      # init habla con el backend en S3: necesita credenciales.
      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Formato
        run: terraform fmt -check -recursive -diff

      - name: Inicializar contra el backend remoto
        run: terraform init -backend-config=backend.hcl

      - name: Validar
        run: terraform validate

  # Politicas sobre el codigo declarado. Detiene ante HIGH o CRITICAL.
  # Una excepcion aceptada se anota junto al recurso, con identificador,
  # razon, responsable y fecha de vencimiento.
  politicas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analisis de configuracion (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  # Plan guardado + compuerta sobre el plan.
  plan:
    needs: [validar, politicas]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.10'
          terraform_wrapper: false

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inicializar
        run: terraform init -backend-config=backend.hcl

      - name: Calcular y guardar el plan
        run: |
          terraform plan -out=tfplan
          terraform show -json tfplan > tfplan.json
          terraform show -no-color tfplan > plan.txt

      # Regla 2: publicar el plan, en texto legible. Informa, no detiene, y va
      # antes de la Regla 1 para que el plan quede visible aunque la
      # compuerta detenga.
      - name: Publicar el plan en el resumen de la ejecucion
        if: always()
        run: |
          {
            echo '## Plan de Terraform'
            echo
            echo '```'
            head -c 60000 plan.txt 2>/dev/null || echo 'No se pudo calcular el plan.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el plan en el pull request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = 'No se pudo calcular el plan.';
            try { plan = fs.readFileSync('infra/plan.txt', 'utf8').slice(0, 60000); } catch (e) {}
            const marca = '<!-- plan-terraform -->';
            const cuerpo = `${marca}\n### Plan de Terraform\n\n\`\`\`\n${plan}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comentarios = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previo = comentarios.find(c => c.body && c.body.includes(marca));
            if (previo) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previo.id, body: cuerpo });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: cuerpo });
            }

      # Regla 1: ninguna destruccion sin autorizacion. Un reemplazo incluye la
      # accion delete, asi que tambien cuenta. La autorizacion es un acto
      # humano: solo una ejecucion manual con el input marcado la concede.
      # No puede venir del codigo ni del plan.
      - name: Compuerta - sin destruccion no autorizada
        env:
          AUTORIZADO: ${{ github.event_name == 'workflow_dispatch' && inputs.autorizar_destruccion == true }}
        run: |
          destruye="$(jq -r '[.resource_changes[]? | select(.change.actions | index("delete")) | .address] | join(", ")' tfplan.json)"
          if [ -n "$destruye" ]; then
            if [ "$AUTORIZADO" = "true" ]; then
              echo "::warning::El plan destruye o reemplaza: ${destruye}. Autorizado manualmente."
            else
              echo "::error::El plan destruye o reemplaza recursos sin autorizacion: ${destruye}"
              echo "Para autorizarlo: Actions > infra > Run workflow, marcando 'autorizar_destruccion'." >&2
              exit 1
            fi
          else
            echo "El plan no destruye nada."
          fi

      # El plan que se aplica es este archivo, no uno recalculado.
      - name: Guardar el plan para aplicar
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 1

  aplicar:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.10'
          terraform_wrapper: false

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Descargar el plan guardado
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - name: Inicializar
        run: terraform init -backend-config=backend.hcl

      - name: Aplicar el plan guardado
        run: terraform apply tfplan