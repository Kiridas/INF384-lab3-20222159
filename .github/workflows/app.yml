name: app

# Pipeline de aplicacion. Es dueno de la imagen que ejecuta la funcion y no
# toca la infraestructura.
#
# De las cuatro gates, solo `secretos` detiene el pipeline. Las otras
# tres informan y dejan pasar: el hallazgo tiene que quedar visible en la
# ejecucion, no enterrado en el log.
#
# El repositorio no tiene archivo de excepciones. Un hallazgo que se decida
# no corregir se anota donde se produce: junto a la linea de codigo que lo
# origina, o en el paso del pipeline que lo detecta cuando el hallazgo no
# corresponde a ninguna linea. La anotacion lleva identificador del hallazgo,
# razon, responsable y fecha de vencimiento. Las cuatro, siempre.
#
# En los jobs sin implementar, preferir una action del marketplace o la
# imagen oficial de la herramienta antes que instalarla paso a paso en el
# runner. La guia del laboratorio lista las referencias disponibles.

on:
  push:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  workflow_dispatch:

jobs:

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar desde el lock file
        run: npm ci

      - name: Pruebas con reporte de cobertura
        run: npm run test:coverage

      - name: Subir el reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # A2 · Compuertas de calidad y seguridad
  # Las cuatro corren en paralelo. Solo `secretos` detiene el pipeline.
  # ---------------------------------------------------------------------

  # Calidad y cobertura en SonarQube Cloud. No detiene: el resultado se lee
  # en Sonar. Consume el reporte de cobertura que produce el job pruebas.
  calidad:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: Sonar distingue el codigo nuevo

      - name: Descargar el reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: coverage

      - name: Analisis en SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

      - name: Enlace al resultado
        run: |
          {
            echo '## Calidad (SonarQube Cloud)'
            echo
            echo "Resultado y cobertura: https://sonarcloud.io/project/overview?id=${{ vars.SONAR_PROJECT_KEY }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Credenciales en el codigo y en el historial. Es la unica que detiene.
  secretos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo

      - name: Detectar secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: 'true'

  # Vulnerabilidades del arbol completo de package-lock.json (con las
  # dependencias de desarrollo). No detiene: el informe queda en el resumen.
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analizar package-lock.json (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'   # arbol completo, no solo produccion
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          format: table
          output: trivy-dependencias.txt
          exit-code: '0'

      - name: Publicar el informe en el resumen
        if: always()
        run: |
          {
            echo '## Dependencias (Trivy, arbol completo)'
            echo
            echo '```'
            head -c 60000 trivy-dependencias.txt 2>/dev/null || echo 'Sin informe.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Patrones explotables en el codigo fuente. No detiene: cada hallazgo se
  # publica como anotacion sobre su linea y en el resumen.
  estatico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analizar el codigo fuente (Semgrep)
        run: |
          docker run --rm \
            --volume "${PWD}:/src" \
            --workdir /src \
            --env SEMGREP_SEND_METRICS=off \
            semgrep/semgrep \
            semgrep scan \
            --config=p/default \
            --config=p/javascript \
            --json --quiet \
            --output=semgrep.json \
            src/

      - name: Publicar los hallazgos
        if: always()
        run: |
          total="$(jq '.results | length' semgrep.json)"
          {
            echo '## Analisis estatico (Semgrep)'
            echo
            echo "Hallazgos: ${total}"
            echo
            if [ "$total" -gt 0 ]; then
              echo '| Severidad | Ubicacion | Regla |'
              echo '|---|---|---|'
              jq -r '.results[] | "| \(.extra.severity) | `\(.path):\(.start.line)` | \(.check_id) |"' semgrep.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.results[] | "::warning file=\(.path),line=\(.start.line),title=\(.check_id)::\(.extra.message | gsub("\n"; " "))"' semgrep.json

  # ---------------------------------------------------------------------
  # A3 · Build y publicacion de la imagen
  # Depende de las cuatro compuertas y corre solo desde la rama principal.
  # Dos tags independientes sobre el mismo manifiesto:
  #   - <sha7>: inmutable, nace del commit. Con este se publica.
  #   - prd:    movil, se reasigna en cada publicacion.
  # El despliegue va siempre por digest.
  # ---------------------------------------------------------------------
  publicar:
    needs: [calidad, secretos, dependencias, estatico]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APLICACION: inf384-lab3
      AMBIENTE: prd
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Entrar al registro
        id: registro
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y publicar con el tag del commit
        env:
          REGISTRO: ${{ steps.registro.outputs.registry }}
        run: |
          sha="${GITHUB_SHA:0:7}"
          imagen="${REGISTRO}/${APLICACION}:${sha}"
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --label "org.opencontainers.image.title=${APLICACION}" \
            --tag "$imagen" \
            .
          docker push "$imagen"

      # Se lee de ECR el digest del manifiesto recien publicado y se entrega
      # completo: <registro>/<aplicacion>@sha256:...
      - name: Leer el digest
        id: digest
        env:
          REGISTRO: ${{ steps.registro.outputs.registry }}
        run: |
          sha="${GITHUB_SHA:0:7}"
          resumen="$(aws ecr describe-images \
            --repository-name "$APLICACION" \
            --image-ids "imageTag=${sha}" \
            --query 'imageDetails[0].imageDigest' --output text)"
          echo "digest=${REGISTRO}/${APLICACION}@${resumen}" >> "$GITHUB_OUTPUT"

      # El tag de ambiente se apunta al manifiesto ya publicado: no reenvia
      # capas. Si prd ya apunta a este mismo manifiesto, ECR responde
      # ImageAlreadyExistsException y no hay nada que hacer.
      - name: Reasignar el tag de ambiente
        run: |
          sha="${GITHUB_SHA:0:7}"
          manifiesto="$(aws ecr batch-get-image \
            --repository-name "$APLICACION" \
            --image-ids "imageTag=${sha}" \
            --query 'images[0].imageManifest' --output text)"
          tipo="$(aws ecr batch-get-image \
            --repository-name "$APLICACION" \
            --image-ids "imageTag=${sha}" \
            --query 'images[0].imageManifestMediaType' --output text)"
          if ! salida="$(aws ecr put-image \
                --repository-name "$APLICACION" \
                --image-tag "$AMBIENTE" \
                --image-manifest "$manifiesto" \
                --image-manifest-media-type "$tipo" 2>&1)"; then
            if echo "$salida" | grep -q 'ImageAlreadyExistsException'; then
              echo "El tag ${AMBIENTE} ya apunta a este manifiesto."
            else
              echo "$salida" >&2
              exit 1
            fi
          fi

      - name: Resumen de la publicacion
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          {
            echo '## Imagen publicada'
            echo
            echo "- Tags: \`${GITHUB_SHA:0:7}\` (inmutable) y \`${AMBIENTE}\` (movil)"
            echo "- Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Este job viene completo y no se modifica.
  # Las estrategias de despliegue y la verificacion posterior son contenido
  # de la sesion 6. La pregunta de reflexion 2 pide leerlo.
  desplegar:
    needs: publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Actualizar la funcion por digest
        run: |
          aws lambda update-function-code \
            --function-name inf384-lab3 \
            --image-uri ${{ needs.publicar.outputs.digest }}

      - name: Esperar a que la actualizacion termine
        run: aws lambda wait function-updated --function-name inf384-lab3